<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas técnicas — Flota Palma Grande</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#16211C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0EE; --card:#FFFFFF; --ink:#16211C; --ink-soft:#4A5B53;
    --steel:#7C8A84; --line:#D3DAD6;
    --green:#1F5D3C; --green-soft:#E2EDE6;
    --amber:#B0600D; --amber-soft:#FBEEDC;
    --red:#9E2B21;   --red-soft:#F9E3E1;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}

  header.top{background:var(--ink);color:#EDF0EE;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top h1{font-size:17px;font-weight:600;margin:0}
  header.top .sub{color:#8FA79A;font-size:13px}
  header.top nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:2px}
  header.top nav button{background:transparent;border:1px solid #34443C;color:#B9C9C1;padding:5px 12px;border-radius:var(--radius);white-space:nowrap}
  header.top nav button[aria-current="true"]{background:#EDF0EE;color:var(--ink);border-color:#EDF0EE;font-weight:600}

  .shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    body[data-mobile="ficha"] aside{display:none}
    body[data-mobile="lista"] main{display:none}
    .backbtn{display:inline-flex !important}
  }

  aside{border-right:1px solid var(--line);background:#E5E9E7;padding:14px 12px 40px}
  .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:10px}
  .grupo{font-size:12px;color:var(--steel);font-weight:600;margin:14px 4px 6px;letter-spacing:.04em}
  .eq{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;margin-bottom:5px;display:flex;gap:9px;align-items:center}
  .eq:hover{border-color:var(--green)}
  .eq[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#EDF0EE}
  .eq[aria-current="true"] .eq-sub{color:#93AA9E}
  .eq[aria-current="true"] .eq-ph{background:#2A3A33}
  .eq-cod{font-weight:700;font-size:13px;min-width:46px}
  .eq-nom{font-size:14px;line-height:1.2}
  .eq-sub{font-size:12px;color:var(--steel)}
  .eq-foto{width:42px;height:32px;flex:none;border-radius:2px;background:#DCE2DE;object-fit:cover;display:block}
  .eq-ph{width:42px;height:32px;flex:none;border-radius:2px;background:#DCE2DE;display:flex;align-items:center;justify-content:center}
  .eq-ph svg{width:22px;height:22px;opacity:.45}
  .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
  .dot.ok{background:var(--green)}.dot.prox{background:var(--amber)}.dot.venc{background:var(--red)}.dot.na{background:var(--line)}
  .addeq{width:100%;margin-top:12px;background:transparent;border:1px dashed var(--steel);color:var(--ink-soft);padding:8px;border-radius:var(--radius)}

  main{padding:0 0 60px}
  .backbtn{display:none;align-items:center;gap:6px;background:none;border:none;color:var(--green);padding:12px 20px 0;font-weight:600}
  .fichahead{background:var(--ink);color:#EDF0EE;padding:18px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
  .fichafoto{width:168px;height:118px;border-radius:2px;overflow:hidden;background:#22302A;display:flex;align-items:center;justify-content:center;flex:none;border:none;padding:0;color:#EDF0EE}
  .fichafoto img{width:100%;height:100%;object-fit:cover;display:block}
  .fichafoto svg{width:54px;height:54px;opacity:.4}
  @media(max-width:560px){.fichafoto{width:100%;height:150px}}
  .fichahead .cod{font-size:30px;font-weight:700;line-height:1}
  .fichahead .nom{font-size:18px;font-weight:600}
  .fichahead .meta{font-size:13px;color:#9CB3A7}
  .fichahead .meta a{color:#BFD4C8}
  .lectura{margin-left:auto;text-align:right}
  .lectura .val{font-size:26px;font-weight:700;line-height:1}
  .lectura .lbl{font-size:12px;color:#9CB3A7}
  .lectura button{background:transparent;border:1px solid #3A4A42;color:#B9C9C1;border-radius:var(--radius);padding:3px 9px;margin-top:6px;font-size:12px}

  .barra{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:#E9ECEA;align-items:center}
  .btn{background:var(--green);color:#fff;border:1px solid var(--green);padding:8px 14px;border-radius:var(--radius);font-weight:600}
  .btn.sec{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:500}
  .btn.sec:hover{border-color:var(--steel)}
  .btn.danger{background:var(--card);color:var(--red);border-color:var(--red-soft)}

  section.bloque{padding:20px 22px 0;max-width:1180px}
  .bloque h2{font-size:15px;margin:0 0 4px;font-weight:600}
  .bloque p.hint{margin:0 0 12px;color:var(--steel);font-size:13px;max-width:74ch}
  .titulo-vista{font-size:22px;font-weight:700;margin:0 0 2px}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th{font-size:12px;text-align:left;color:var(--ink-soft);font-weight:600;padding:9px 10px;background:#E9ECEA;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #E9ECEA;vertical-align:middle;font-size:14px}
  tr:last-child td{border-bottom:none}
  tr.clic{cursor:pointer}
  tr.clic:hover td{background:#F3F6F4}
  td.num,th.num{text-align:right;white-space:nowrap}
  tfoot td{background:#E9ECEA;font-weight:600;border-top:1px solid var(--line)}
  .ref{font-size:13px}
  .ref.vacio{color:var(--steel);font-style:italic}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.prox{background:var(--amber-soft);color:var(--amber)}
  .badge.venc{background:var(--red-soft);color:var(--red)}
  .badge.na{background:#E9ECEA;color:var(--steel)}
  .badge.propio{background:#E7EDF3;color:#2A4C6B}
  .linkbtn{background:none;border:none;color:var(--green);padding:2px 4px;font-size:13px;text-decoration:underline}
  .linkbtn.del{color:var(--red)}
  .vacio-msg{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:20px;color:var(--steel);text-align:center}

  .tarjetas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .tarjeta{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:132px;flex:1}
  .tarjeta .n{font-size:28px;font-weight:700;line-height:1.1}
  .tarjeta .t{font-size:13px;color:var(--ink-soft)}
  .tarjeta.venc{border-left:3px solid var(--red)} .tarjeta.venc .n{color:var(--red)}
  .tarjeta.prox{border-left:3px solid var(--amber)} .tarjeta.prox .n{color:var(--amber)}
  .tarjeta.ok{border-left:3px solid var(--green)} .tarjeta.ok .n{color:var(--green)}

  .plan{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .plan:hover{border-color:var(--green)}
  .plan .pn{font-weight:600}
  .plan .pd{font-size:13px;color:var(--steel)}
  .plan .pright{margin-left:auto;text-align:right;font-size:13px;color:var(--ink-soft)}

  .graf{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .gb-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .gb-row:last-child{margin-bottom:0}
  .gb-lab{width:150px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gb-track{flex:1;height:19px;background:#EDF0EE;border-radius:2px;overflow:hidden;min-width:40px}
  .gb-fill{display:block;height:100%;background:var(--green);border-radius:2px}
  .gb-fill.alto{background:var(--amber)}
  .gb-val{width:120px;flex:none;text-align:right;font-size:13px;white-space:nowrap}
  .gb-grupo{font-size:12px;color:var(--steel);font-weight:600;margin:12px 0 6px}
  .gb-grupo:first-child{margin-top:0}
  .gv{display:flex;gap:6px;align-items:flex-end;height:170px}
  .gv-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
  .gv-val{font-size:11px;color:var(--ink-soft);margin-bottom:3px;white-space:nowrap}
  .gv-bar{width:100%;max-width:46px;background:var(--green);border-radius:2px 2px 0 0;min-height:2px}
  .gv-bar.cero{background:var(--line)}
  .gv-lab{font-size:11px;color:var(--steel);margin-top:5px;white-space:nowrap}
  @media(max-width:560px){.gb-lab{width:96px}.gb-val{width:88px;font-size:12px}}
  .qr-caja{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;flex-wrap:wrap}
  .qr-caja img,.qr-caja canvas{width:112px;height:112px;flex:none}
  .qr-txt{font-size:13px;color:var(--ink-soft);max-width:52ch}

  .overlay{position:fixed;inset:0;background:rgba(15,25,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .overlay[hidden]{display:none}
  .modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:580px;max-height:90vh;overflow:auto;box-shadow:0 18px 50px rgba(10,20,15,.3)}
  .modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .body{padding:18px 20px}
  .modal .pie{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
  .sep{margin:16px -20px 14px;padding:10px 20px 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft)}
  .sep small{display:block;font-weight:400;color:var(--steel)}
  label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--ink-soft);font-weight:600}
  label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#FAFBFA;font-weight:400;color:var(--ink)}
  .fila{display:flex;gap:12px;flex-wrap:wrap}
  .fila>*{flex:1;min-width:120px}
  .check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:#FAFBFA}
  .check input{margin-top:3px}
  .check.on{border-color:var(--green);background:var(--green-soft)}
  .check .c-nom{font-weight:600;font-size:14px}
  .check .c-sub{font-size:12px;color:var(--ink-soft)}
  #aviso-almacen{background:var(--red-soft);color:#7A211A;border-bottom:1px solid #E9C3BF;padding:9px 20px;font-size:13px}
  .aviso{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 12px;border-radius:2px;font-size:13px;color:#7A430A;margin-bottom:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#EDF0EE;padding:10px 18px;border-radius:var(--radius);z-index:80;font-size:14px}
  .toast[hidden]{display:none}
  .cargando{padding:40px 22px;color:var(--steel)}

  #print-area{display:none}
  @media print{
    body{background:#fff}
    header.top,.shell,.overlay,.toast{display:none !important}
    #print-area{display:block}
    @page{margin:12mm}
    .p-head{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid #16211C;padding-bottom:10px;margin-bottom:14px}
    .p-foto{width:150px;height:105px;object-fit:cover;border:1px solid #999;flex:none}
    .p-cod{font-size:26px;font-weight:700;line-height:1}
    .p-qr{margin-left:auto;text-align:center;font-size:9px;color:#555}
    .p-qr img{width:92px;height:92px;display:block}
    #print-area h4{font-size:12px;margin:14px 0 5px;padding-bottom:3px;border-bottom:1px solid #ccc}
    #print-area table{border:1px solid #999;font-size:11px;width:100%;border-collapse:collapse}
    #print-area th{background:#EEE;padding:4px 6px;border-bottom:1px solid #999;text-align:left}
    #print-area td{padding:4px 6px;border-bottom:1px solid #DDD}
    #print-area tr{page-break-inside:avoid}
    .p-firma{margin-top:26px;display:flex;gap:40px;font-size:11px}
    .p-firma div{flex:1;border-top:1px solid #333;padding-top:4px}
    .p-pie{margin-top:16px;font-size:10px;color:#666;border-top:1px solid #CCC;padding-top:6px}
    .p-datos{margin-bottom:4px}
    .p-datos th{width:15%;background:#F4F4F4;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:#444}
    .p-datos td{font-size:11px;font-weight:600}
  }
</style>

<body data-mobile="lista">

<header class="top">
  <h1>Fichas técnicas de flota</h1>
  <span class="sub">Palma Grande S.A.S.</span>
  <nav id="nav"></nav>
</header>

<div class="shell">
  <aside>
    <input class="search" id="buscar" placeholder="Buscar equipo, placa o modelo" autocomplete="off">
    <div id="lista"></div>
    <button class="addeq" id="btn-nuevo-equipo">+ Agregar equipo</button>
  </aside>
  <main id="main"><div class="cargando">Cargando fichas…</div></main>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="print-area"></div>
<div id="qr-oculto" style="position:absolute;left:-9999px;top:-9999px"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   MODELO
   planes[]  : hoja de configuración. Qué lleva y cada cuánto. Horas para
               máquinas, kilómetros para camiones. Se comparte entre equipos
               del mismo modelo.
   equipos[] : cada equipo apunta a un plan y guarda su propio estado
               (cuándo se le hizo cada cambio) en equipo.estado[itemId].
   ===================================================================== */
const KEY = 'fichas-flota-v2';
const KEY_FOTOS = 'fichas-flota-fotos-v1';
const KEY_BACKEND = 'fichas-flota-backend-v1';

/* ---------------- Backend compartido (Google Sheets + Apps Script) ----------------
   Solo se sincronizan planes/equipos/historial/config: las fotos son pesadas y
   se quedan solo en el dispositivo donde se tomaron. Ver README para desplegar
   el backend y para cómo se arma _bk más abajo (deja cualquier dispositivo
   conectado sin pegar nada a mano). */
const _bk = 'eyJ1cmwiOiAiaHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4aU0wZnhtajFsWXBhMVhRZTJncER3YWJTbUQ4OEQzT2RDNVg2amtJaUVweXoxc0lMWGdHM0NVX0l3Skd2b216QnF5US9leGVjIiwgInRva2VuIjogIjIxMDUifQ==';
const BACKEND_DEFAULT = (() => { try{ return JSON.parse(atob(_bk)); }catch(e){ return {url:'',token:''}; } })();
let sinSincronizar = false;
const backendConf = () => {
  try{ const propio = JSON.parse(localStorage.getItem(KEY_BACKEND) || 'null'); if(propio && propio.url && propio.token) return propio; }
  catch(e){}
  return BACKEND_DEFAULT.url ? BACKEND_DEFAULT : null;
};
const backendEsPropio = () => { try{ const p = JSON.parse(localStorage.getItem(KEY_BACKEND) || 'null'); return !!(p && p.url && p.token); }catch(e){ return false; } };
const guardarBackendConf = c => { try{ localStorage.setItem(KEY_BACKEND, JSON.stringify(c)); }catch(e){} };
async function remoto(op, key, valor){
  const c = backendConf();
  if(!c || !c.url || !c.token) return null;
  const qs = new URLSearchParams({op, key:key||'', token:c.token});
  const url = c.url + (c.url.includes('?') ? '&' : '?') + qs.toString();
  const esEscritura = op === 'set' || op === 'set_secret' || op === 'set_foto' || op === 'del_foto';
  const opts = esEscritura
    ? {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({value:valor})}
    : {method:'GET'};
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error('http '+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'backend');
  return j;
}
async function remotoGet(key){ const j = await remoto('get', key); return j ? j.value : null; }
async function remotoSet(key, valor){ await remoto('set', key, valor); }
/* Cambia la clave en el backend (requiere la clave actual, ya guardada en
   backendConf) y, si sale bien, actualiza también la copia de este dispositivo. */
async function remotoCambiarClave(nueva){
  await remoto('set_secret', null, nueva);
  const c = backendConf();
  guardarBackendConf(Object.assign({}, c, {token: nueva}));
}
/* Sube una foto (data URL) al backend. eq.fotoUrl guarda solo un indicador
   ("hay foto en el backend"), no un enlace directo: un <img src> apuntando
   a Drive no siempre carga (algunas cuentas, sobre todo de organización,
   bloquean ese tipo de enlace), así que la foto se vuelve a pedir por la
   misma API (remotoObtenerFoto) y se muestra desde ahí. */
async function remotoSubirFoto(id, dataUrl){ await remoto('set_foto', id, dataUrl); }
async function remotoBorrarFoto(id){ await remoto('del_foto', id); }
async function remotoObtenerFoto(id){ const j = await remoto('get_foto', id); return j ? j.dataUrl : null; }
/* La foto de un equipo: la copia local si ya se tiene (inmediata, sirve sin
   internet); si no, se está pidiendo al backend en segundo plano (ver
   asegurarFotos) y aparece en cuanto llegue. */
const fotoDe = eq => fotos[eq.id] || null;
/* Trae del backend las fotos que este dispositivo todavía no tiene en su
   copia local (por ejemplo, equipos con foto subida desde otro
   dispositivo). Se llama al cargar y al sincronizar; no bloquea el resto
   de la app mientras las va trayendo. */
async function asegurarFotos(){
  if(!backendConf()) return;
  const faltantes = data.equipos.filter(eq => eq.fotoUrl && !fotos[eq.id]);
  if(!faltantes.length) return;
  let huboAlguna = false;
  for(const eq of faltantes){
    try{
      const dataUrl = await remotoObtenerFoto(eq.id);
      if(dataUrl){ fotos[eq.id] = dataUrl; huboAlguna = true; }
    }catch(e){ /* se reintenta la próxima vez que se sincronice */ }
  }
  if(huboAlguna){ await DB.guardarFotos(fotos); pintarLista(); pintarMain(); }
}

const DB = {
  async cargar(){
    if(backendConf()){
      try{
        const v = await remotoGet(KEY);
        if(v){ localStorage.setItem(KEY, v); sinSincronizar = false; return JSON.parse(v); }
      }catch(e){ sinSincronizar = true; }
    }
    try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async guardar(d){
    const txt = JSON.stringify(d);
    let okLocal = true;
    try{ localStorage.setItem(KEY, txt); }catch(e){ okLocal = false; }
    if(backendConf()){
      try{ await remotoSet(KEY, txt); sinSincronizar = false; }
      catch(e){ sinSincronizar = true; }
    }
    return okLocal;
  },
  async cargarViejo(){ try{ const v = localStorage.getItem('fichas-flota-v1'); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  async cargarFotos(){ try{ const v = localStorage.getItem(KEY_FOTOS); return v ? JSON.parse(v) : {}; }catch(e){ return {}; } },
  async guardarFotos(f){ try{ localStorage.setItem(KEY_FOTOS, JSON.stringify(f)); return true; }
    catch(e){ toast('No se pudo guardar la foto. Puede que ya no quepan más imágenes.'); return false; } }
};

/* ---------------- Configuración base ---------------- */
const PLANTILLA_TRACTOR = [
  ['filtro','Filtro de aceite de motor','und',250],

/* ---------------- Items de un equipo = plan + propios + estado ---------------- */
function itemsDe(eq){

  const props = (eq.propios||[]).map(i => Object.assign({}, i, {origen:'propio'}));

/* ---------------- Proveedores por ítem ----------------
   Cada filtro/lubricante puede tener varias referencias, una por
   proveedor (a veces se compra en uno, a veces en otro, y el número de
   parte puede cambiar). proveedorPreferidoId marca cuál se usa por
   defecto en fichas, requisición y catálogo; al registrar un cambio se
   puede elegir cuál de todos se usó esa vez. */
function refPreferida(it){
  const provs = it.proveedores || [];
  if(!provs.length) return null;
  return provs.find(p => p.id === it.proveedorPreferidoId) || provs[0];
}
function refTexto(it){
  const p = refPreferida(it);
  return p ? p.referencia : '';
}
function tieneRef(it){ return !!(it.proveedores && it.proveedores.length); }

/* ---------------- Fotos ---------------- */
function comprimirFoto(file){
  return new Promise((resolve,reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('lectura'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('imagen'));
      img.onload = () => {
        const max = 1000, k = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.62));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function elegirFoto(eq){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    toast('Procesando foto…');
    let dataUrl;
    try{ dataUrl = await comprimirFoto(f); }
    catch(e){ return toast('No se pudo leer esa imagen. Intente con otra.'); }
    fotos[eq.id] = dataUrl;
    if(!await DB.guardarFotos(fotos)){ delete fotos[eq.id]; return; }
    pintarLista(); pintarMain(); toast('Foto guardada en este dispositivo');
    if(backendConf()){
      toast('Subiendo foto al backend…');
      try{
        await remotoSubirFoto(eq.id, dataUrl);
        eq.fotoUrl = true;
        await persistir();
        pintarLista(); pintarMain(); toast('Foto sincronizada');
      }catch(e){ toast('La foto quedó guardada en este dispositivo, pero no se pudo subir al backend: ' + e.message); }
    }
  };
  inp.click();
}

/* ---------------- Cálculos ---------------- */
function estadoItem(eq, it){
  if(!it.intervalo || it.ultLectura == null) return {clave:'na', txt:'Sin registrar', restante:null, proximo:null};
  const proximo = Number(it.ultLectura) + Number(it.intervalo);
  const restante = proximo - Number(eq.lectura||0);
  if(restante <= 0) return {clave:'venc', txt:'Vencido', restante, proximo};
  if(restante <= it.intervalo*0.15) return {clave:'prox', txt:'Próximo', restante, proximo};
  return {clave:'ok', txt:'Al día', restante, proximo};
}
function estadoEquipo(eq){
  const e = itemsDe(eq).map(i => estadoItem(eq,i).clave);
  if(!e.length) return 'na';
  if(e.includes('venc')) return 'venc';
  if(e.includes('prox')) return 'prox';
  return e.every(x => x==='na') ? 'na' : 'ok';
}
/* Uso diario medido: suma los tramos entre lecturas consecutivas e ignora los que
   retroceden, para que una lectura mal digitada no arruine todo el cálculo. */
function usoDiario(eq){
  const b = (eq.bitacora||[]).filter(r => r.lectura != null && r.fecha).sort((a,c)=>a.fecha.localeCompare(c.fecha));
  const tope = eq.medidor === 'km' ? 800 : 20;   // tope de plausibilidad por día
  let horas = 0, dias = 0;
  for(let i = 1; i < b.length; i++){
    const d = (new Date(b[i].fecha) - new Date(b[i-1].fecha)) / 86400000;
    const delta = Number(b[i].lectura) - Number(b[i-1].lectura);
    if(d > 0 && delta >= 0 && delta/d <= tope){ horas += delta; dias += d; }
  }
  if(dias >= 5 && horas > 0) return {valor: horas/dias, fuente:'medido', dias:Math.round(dias)};
  return {valor: Number(eq.usoDia) || USO_DEF[eq.tipo] || 6, fuente:'estimado'};
}
function proyeccion(eq, it){
  const e = estadoItem(eq,it);
  if(e.restante == null) return Object.assign({}, e, {dias:null, fecha:null});
  if(!trabajando(eq)) return Object.assign({}, e, {dias:null, fecha:null, parado:true});
  const uso = usoDiario(eq);
  if(!uso.valor) return Object.assign({}, e, {dias:null, fecha:null});
  const dias = Math.round(e.restante / uso.valor);
  const d = new Date(); d.setDate(d.getDate() + dias);
  return Object.assign({}, e, {dias, fecha:isoLocal(d), uso});
}
const fechaCorta = f => f ? new Date(f+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) : '—';
const fechaHora = iso => { if(!iso) return null;
  const d = new Date(iso); if(isNaN(d)) return null;
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
};
/* Días entre la fecha del cambio y el momento en que se digitó */
function desfaseRegistro(h){
  if(!h.registrado || !h.fecha) return null;
  const d = Math.round((new Date(h.registrado) - new Date(h.fecha+'T12:00:00')) / 86400000);
  return d > 0 ? d : 0;
}
function textoDias(d){
  if(d == null) return '—';
  if(d < 0) return Math.abs(d)+' días atrás';
  if(d === 0) return 'hoy';
  return 'en '+d+' días';
}
function pendientes(diasMax){
  const out = [];
  data.equipos.forEach(eq => itemsDe(eq).forEach(it => {
    const p = proyeccion(eq,it);
    if(p.clave === 'na') return;
    if(diasMax != null){ if(p.dias == null || p.dias > diasMax) return; }
    else if(p.clave === 'ok') return;
    out.push({eq, it, p});
  }));
  return out.sort((a,b) => (a.p.dias ?? 9e9) - (b.p.dias ?? 9e9));
}
function faltanRefsPlan(plan){ return plan.items.filter(i => !tieneRef(i)).length; }

/* ---------------- Gráficas (HTML puro, sin librerías) ---------------- */
function barrasH(filas){
  const max = Math.max(...filas.map(f => f.valor), 0);
  if(!max) return '';
  return filas.map(f => `<div class="gb-row">
      <span class="gb-lab" title="${esc(f.etiqueta)}">${esc(f.etiqueta)}</span>
      <span class="gb-track"><span class="gb-fill ${f.alto?'alto':''}" style="width:${Math.max(2, f.valor/max*100)}%"></span></span>
      <span class="gb-val mono">${esc(f.texto)}</span>
    </div>`).join('');
}
function barrasV(cols){
  const max = Math.max(...cols.map(c => c.valor), 0);
  return `<div class="gv">${cols.map(c => `<div class="gv-col">
      <span class="gv-val">${c.valor ? esc(c.texto) : ''}</span>
      <span class="gv-bar ${c.valor?'':'cero'}" style="height:${max ? Math.max(1, c.valor/max*100) : 1}%"></span>
      <span class="gv-lab">${esc(c.etiqueta)}</span>
    </div>`).join('')}</div>`;
}
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function ultimosMeses(n){
  const out = [], d = new Date();
  d.setDate(1);
  for(let i = n-1; i >= 0; i--){
    const m = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push({clave: isoLocal(m).slice(0,7), etiqueta: MESES[m.getMonth()]});
  }
  return out;
}
function proximosMeses(n){
  const out = [], d = new Date();
  d.setDate(1);
  for(let i = 0; i < n; i++){
    const m = new Date(d.getFullYear(), d.getMonth()+i, 1);
    out.push({clave: isoLocal(m).slice(0,7), etiqueta: MESES[m.getMonth()]});
  }
  return out;
}

/* ---------------- Gestor de proveedores dentro del editor de un ítem ----------------
   Varias filas (proveedor + referencia + costo unitario), una marcada como
   preferida. Se manipula el DOM directamente (agregar/quitar filas) en vez
   de llevar un estado JS aparte, para no perder lo que la persona ya iba
   escribiendo en las demás filas. */
function filaProveedor(p, preferidoId){
  return `<div class="fila" data-pv="${p.id}" style="align-items:flex-end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)">

    <label class="f" style="flex:1;margin-bottom:0">Costo unit.<input type="number" class="pv-costo" value="${p.costoUnitario??''}" placeholder="0"></label>
    <label style="display:flex;align-items:center;gap:4px;margin-bottom:8px;font-size:13px;white-space:nowrap"><input type="radio" name="pv-pref-${p._grupo||''}" value="${p.id}" ${p.id===preferidoId?'checked':''}> Preferido</label>
    <button type="button" class="linkbtn del" data-pvdel style="margin-bottom:8px">Quitar</button>
  </div>`;
}
function htmlProveedores(it, idGrupo){
  const provs = (it.proveedores||[]).map(p => Object.assign({}, p, {_grupo:idGrupo}));
  return `<div class="sep" style="margin-top:0">Proveedores<small>Puede tener varios (a veces se compra en uno, a veces en otro); marque cuál usar por defecto.</small></div>
    <div id="provs-${idGrupo}">${provs.map(p => filaProveedor(p, it.proveedorPreferidoId)).join('')}</div>
    <button type="button" class="btn sec" id="prov-agregar-${idGrupo}" style="margin-bottom:14px">+ Agregar proveedor</button>`;
}
/* onMount: engancha agregar/quitar filas. Llamar dentro del onMount del abrir(). */
function wireProveedores(idGrupo){
  const lista = $('#provs-'+idGrupo);
  lista.addEventListener('click', e => {
    const btn = e.target.closest('[data-pvdel]');
    if(btn) btn.closest('[data-pv]').remove();
  });
  $('#prov-agregar-'+idGrupo).onclick = () => {
    const esPrimero = !lista.querySelector('[data-pv]');
    const nuevoId = nid();
    lista.insertAdjacentHTML('beforeend', filaProveedor({id:nuevoId, proveedor:'', referencia:'', costoUnitario:null, _grupo:idGrupo}, esPrimero ? nuevoId : null));
  };
}
/* Lee las filas del DOM al guardar. Descarta las que quedaron sin referencia. */
function leerProveedores(idGrupo){
  const lista = $('#provs-'+idGrupo);
  const provs = [...lista.querySelectorAll('[data-pv]')].map(row => ({
    id: row.dataset.pv,
    proveedor: row.querySelector('.pv-nombre').value.trim(),
    referencia: row.querySelector('.pv-ref').value.trim(),
    costoUnitario: row.querySelector('.pv-costo').value === '' ? null : Number(row.querySelector('.pv-costo').value)
  })).filter(p => p.referencia);
  const marcado = lista.querySelector('input[type=radio]:checked');
  let preferidoId = marcado ? marcado.value : null;
  if(!provs.some(p => p.id === preferidoId)) preferidoId = provs[0] ? provs[0].id : null;
  return {proveedores:provs, proveedorPreferidoId:preferidoId};
}

/* =====================================================================
   Requisición
   ===================================================================== */
function agruparRequisicion(dias){
  const map = new Map();
  pendientes(dias).forEach(({eq,it,p}) => {
    const clave = (refTexto(it) || 'SIN-REF · '+it.componente).toUpperCase();
    if(!map.has(clave)){
      const pref = refPreferida(it);
      map.set(clave, {referencia:refTexto(it), proveedor: pref ? pref.proveedor : '', componente:it.componente, unidad:it.unidad, cantidad:0, equipos:[], dias:p.dias, fecha:p.fecha});
    }
    const g = map.get(clave);
    g.cantidad += Number(it.cantidad) || 0;
    g.equipos.push(eq.codigo);
    if(p.dias != null && (g.dias == null || p.dias < g.dias)){ g.dias = p.dias; g.fecha = p.fecha; }
  });
  return [...map.values()].sort((a,b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));
}
function descargar(blob, nombre){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 1000);
}

/* =====================================================================

function pintarReferencias(){
  const map = new Map();
  data.equipos.forEach(eq => itemsDe(eq).forEach(it => {
    if(!tieneRef(it)) return;
    const ref = refTexto(it);
    const k = ref.trim().toUpperCase();
    if(!map.has(k)) map.set(k, {referencia:ref.trim(), componentes:new Set(), unidad:it.unidad, equipos:[], anual:0});
    const g = map.get(k);
    g.componentes.add(it.componente); g.equipos.push(eq.codigo);
    if(it.intervalo && it.cantidad && trabajando(eq)) g.anual += (usoDiario(eq).valor*365/it.intervalo) * Number(it.cantidad);
  }));
  const filas = [...map.values()].sort((a,b) => b.equipos.length - a.equipos.length || a.referencia.localeCompare(b.referencia));
  const compartidas = filas.filter(f => f.equipos.length > 1).length;
  $('#main').innerHTML = `
    <section class="bloque" style="padding-top:24px">
      <h1 class="titulo-vista">Catálogo de referencias</h1>
      <p class="hint">Qué referencia sirve para cuáles equipos y cuánto se consume al año. Sirve para negociar por volumen y para decidir qué vale la pena tener en almacén.</p>
      ${filas.length ? `
        <div class="tarjetas">
          <div class="tarjeta"><div class="n">${filas.length}</div><div class="t">Referencias distintas</div></div>
          <div class="tarjeta"><div class="n">${compartidas}</div><div class="t">Se usan en más de un equipo</div></div>
        </div>
        <table><thead><tr><th>Referencia</th><th>Componente</th><th class="num">Equipos</th><th>Cuáles</th><th class="num">Consumo al año</th></tr></thead>
        <tbody>${filas.map(f => `<tr>

/* =====================================================================
   Costos
   ===================================================================== */
function costoEquipo(eq){
  const h = data.historial.filter(x => x.equipoId === eq.id);
  const total = h.reduce((s,x) => s + (Number(x.costo)||0), 0);
  const lecturas = h.map(x => Number(x.lectura)).filter(n => n > 0);
  const periodo = lecturas.length ? Math.max(0, Number(eq.lectura||0) - Math.min(...lecturas)) : 0;
  return {cambios:h.length, total, periodo, unitario: periodo > 0 ? total/periodo : null};
}
function pintarCostos(){
  const filas = data.equipos.map(eq => Object.assign({eq}, costoEquipo(eq)))
                            .sort((a,b) => (b.unitario ?? -1) - (a.unitario ?? -1));
  const total = filas.reduce((s,f) => s + f.total, 0);
  const conDato = filas.filter(f => f.unitario != null).length;

  /* Gráfica 1: costo por hora, agrupado por modelo para comparar iguales con iguales */
  let comparativo = '';
  const conCosto = filas.filter(f => f.unitario != null && f.cambios >= 2);
  if(conCosto.length){
    const maxGlobal = Math.max(...conCosto.map(f => f.unitario));
    const grupos = new Map();
    conCosto.forEach(f => {
      const plan = planPorId(f.eq.planId);
      const k = plan ? plan.nombre : 'Sin hoja asignada';
      if(!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(f);
    });
    comparativo = `<div class="graf">${[...grupos.entries()].map(([nombre, fs]) => `
        <div class="gb-grupo">${esc(nombre)}</div>
        ${barrasH(fs.map(f => ({
          etiqueta: f.eq.codigo+' '+f.eq.modelo,
          valor: f.unitario,
          alto: f.unitario >= maxGlobal*0.9 && conCosto.length > 1,
          texto: money(f.unitario)+' / '+u(f.eq)
        })))}`).join('')}</div>`;
  }

  /* Gráfica 2: gasto por mes */
  const meses = ultimosMeses(12);
  const porMes = {};
  data.historial.forEach(h => {
    if(!h.fecha || !h.costo) return;
    const k = h.fecha.slice(0,7);
    porMes[k] = (porMes[k]||0) + Number(h.costo);
  });
  const hayMes = meses.some(m => porMes[m.clave]);
  const mensual = hayMes ? barrasV(meses.map(m => ({
    etiqueta: m.etiqueta, valor: porMes[m.clave]||0,
    texto: (porMes[m.clave]||0) >= 1000000 ? ((porMes[m.clave]/1000000).toFixed(1)+'M') : Math.round((porMes[m.clave]||0)/1000)+'k'
  }))) : '';

  const graficas = (comparativo || mensual) ? `
      <h2>Comparación entre equipos</h2>
      <p class="hint">Agrupado por modelo: dos máquinas iguales deberían costar parecido. La barra ámbar es la más cara de la flota.</p>
      ${comparativo || '<div class="vacio-msg">Todavía ningún equipo tiene dos cambios registrados. Con uno solo el costo por hora sale disparado, por eso no se grafica; abajo sí aparece en la tabla.</div>'}
      ${mensual ? `<h2 style="margin-top:22px">Gasto por mes</h2>
        <p class="hint">Suma de lo registrado en cada mes, en miles de pesos.</p>
        <div class="graf">${mensual}</div>` : ''}`
    : `<div class="vacio-msg">Las gráficas aparecen cuando registre cambios con su costo. Con dos o tres por equipo ya se puede comparar.</div>`;

  $('#main').innerHTML = `
    <section class="bloque" style="padding-top:24px">
      <h1 class="titulo-vista">Costo de mantenimiento</h1>
      <p class="hint">Se calcula con los costos que usted registra en cada cambio, sobre las horas o kilómetros corridos desde el primer cambio registrado. Necesita al menos dos cambios en un equipo para que el dato sirva.</p>
      <div class="tarjetas">
        <div class="tarjeta"><div class="n" style="font-size:22px">${money(total)}</div><div class="t">Costo acumulado registrado</div></div>
        <div class="tarjeta"><div class="n">${data.historial.length}</div><div class="t">Cambios registrados</div></div>
        <div class="tarjeta"><div class="n">${conDato}</div><div class="t">Equipos con costo por hora calculable</div></div>
      </div>
      ${graficas}
      <h2 style="margin-top:22px">Detalle por equipo</h2>
      <p class="hint">Ordenado del más costoso al más barato.</p>
      <table><thead><tr><th>Equipo</th><th class="num">Cambios</th><th class="num">Costo total</th>
        <th class="num">Período corrido</th><th class="num">Costo por hora o km</th></tr></thead>
      <tbody>${filas.map(f => `<tr class="clic" data-id="${f.eq.id}">
        <td><strong class="mono">${esc(f.eq.codigo)}</strong> <span style="color:var(--steel)">${esc(f.eq.marca)} ${esc(f.eq.modelo)}</span></td>
        <td class="num">${f.cambios || '—'}</td>
        <td class="num mono">${f.total ? money(f.total) : '—'}</td>
        <td class="num mono">${f.periodo ? nfmt(f.periodo)+' '+u(f.eq) : '—'}</td>
        <td class="num mono">${f.unitario != null ? money(f.unitario)+' / '+u(f.eq) : '—'}</td></tr>`).join('')}</tbody></table>
    </section>`;
  $('#main').querySelectorAll('tr.clic').forEach(t => t.onclick = () => abrirFicha(t.dataset.id));
}

function modalItemEquipo(eq, it){
  const nuevo = !it;
  const plan = planPorId(eq.planId);
  const eqs = plan ? equiposDePlan(plan.id) : [];
  const esPlan = it ? it.origen === 'plan' : true;
  const base = it || {id:nid(), categoria:'filtro', componente:'', proveedores:[], proveedorPreferidoId:null, cantidad:null, unidad:'und', intervalo:null, ultLectura:null, ultFecha:''};
  abrir(`<h3>${nuevo?'Agregar filtro o aceite':'Editar'} — ${esc(eq.codigo)}</h3>
    <div class="body">
      ${nuevo ? `<label class="f">¿A quién aplica?<select id="alcance">
          <option value="plan">A todos los ${eqs.length} equipo(s) con la hoja ${esc(plan?plan.nombre:'')}</option>
          <option value="propio">Solo a este equipo</option></select></label>`
        : (esPlan && eqs.length>1 ? `<div class="aviso">Referencia, cantidad e intervalo vienen de la hoja ${esc(plan.nombre)}; al cambiarlos se actualizan los ${eqs.length} equipos: ${eqs.map(e=>esc(e.codigo)).join(', ')}. El último cambio es solo de ${esc(eq.codigo)}.</div>` : '')}
      <div class="fila">
        <label class="f">Tipo<select id="cat">
          <option value="filtro" ${base.categoria==='filtro'?'selected':''}>Filtro</option>
          <option value="lubricante" ${base.categoria==='lubricante'?'selected':''}>Lubricante</option></select></label>
        <label class="f">Componente<input id="comp" value="${esc(base.componente)}" placeholder="Filtro de aceite de motor"></label>
      </div>
      <div class="fila">
        <label class="f">Cantidad<input type="number" step="0.1" id="cant" value="${base.cantidad??''}"></label>
        <label class="f">Unidad<select id="uni">${['und','gal','L','kg'].map(x=>`<option ${base.unidad===x?'selected':''}>${x}</option>`).join('')}</select></label>
        <label class="f">Cambio cada (${u(eq)})<input type="number" id="int" value="${base.intervalo??''}"></label>
      </div>
      ${htmlProveedores(base, 'eq')}
      <div class="sep">Último cambio en ${esc(eq.codigo)}<small>Este dato es propio del equipo y no afecta a los demás.</small></div>
      <div class="fila">
        <label class="f">Se hizo a los (${u(eq)})<input type="number" id="ult" value="${base.ultLectura??''}"></label>
        <label class="f">Fecha<input type="date" id="ultf" value="${base.ultFecha||''}"></label>
      </div>
    </div>
    <div class="pie">${nuevo?'':'<button class="btn danger" id="del" style="margin-right:auto">Eliminar</button>'}
      <button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="ok">Guardar</button></div>`,
    () => {
      wireProveedores('eq');
      $('#ok').onclick = async () => {
        const comp = $('#comp').value.trim();
        if(!comp) return toast('Escriba el nombre del componente.');
        const def = Object.assign({categoria:$('#cat').value, componente:comp,
          cantidad:$('#cant').value===''?null:Number($('#cant').value), unidad:$('#uni').value,
          intervalo:$('#int').value===''?null:Number($('#int').value)}, leerProveedores('eq'));
        let id = base.id;
        if(nuevo){
          const alPlan = $('#alcance').value === 'plan' && plan;
          const nuevoIt = Object.assign({id}, def);
          if(alPlan) plan.items.push(nuevoIt);
          else { eq.propios = eq.propios || []; eq.propios.push(nuevoIt); }
        } else if(esPlan && plan){
          Object.assign(plan.items.find(x => x.id === id), def);
        } else {
          Object.assign((eq.propios||[]).find(x => x.id === id), def);
        }
        const ul = $('#ult').value === '' ? null : Number($('#ult').value);
        if(ul == null){ if(eq.estado) delete eq.estado[id]; }
        else fijarUltimo(eq, id, ul, $('#ultf').value || hoy());
        await persistir(); cerrar(); pintarLista(); pintarMain(); avisar('Guardado');
      };
      const d = $('#del');
      if(d) d.onclick = () => {
        const alcance = esPlan && plan ? 'la hoja '+plan.nombre+' y de los '+eqs.length+' equipo(s) que la usan' : 'este equipo';
        confirmar('Eliminar elemento', 'Se quita "'+base.componente+'" de '+alcance+'.', async () => {
          if(esPlan && plan){
            plan.items = plan.items.filter(x => x.id !== base.id);
            eqs.forEach(e => { if(e.estado) delete e.estado[base.id]; });
          } else {
            eq.propios = (eq.propios||[]).filter(x => x.id !== base.id);
            if(eq.estado) delete eq.estado[base.id];
          }
          await persistir(); pintarLista(); pintarMain(); avisar('Elemento eliminado');
        });
      };
    });
}

/* ---------------- QR ---------------- */
const textoQR = eq => data.config.urlBase ? data.config.urlBase.replace(/#.*$/,'') + '#' + encodeURIComponent(eq.codigo) : eq.codigo;
function dibujarQR(cont, texto, size){
  if(!cont) return null;
  cont.innerHTML = '';
  if(typeof QRCode === 'undefined'){
    cont.innerHTML = '<div class="qr-txt" style="width:150px">No se pudo cargar el generador de códigos. Necesita conexión a internet la primera vez que abre el aplicativo.</div>';
    return null;
  }
  try{ new QRCode(cont, {text:texto, width:size, height:size, correctLevel:QRCode.CorrectLevel.M}); return cont; }
  catch(e){ return null; }
}
function qrDataURL(texto, size){
  const caja = $('#qr-oculto');
  if(!dibujarQR(caja, texto, size)) return '';
  const cv = caja.querySelector('canvas');
  if(cv){ try{ return cv.toDataURL('image/png'); }catch(e){} }
  const im = caja.querySelector('img');
  return im ? im.src : '';
}

function confirmar(titulo, texto, accion){
  abrir(`<h3>${esc(titulo)}</h3><div class="body"><p style="margin:0;color:var(--ink-soft)">${esc(texto)}</p></div>
    <div class="pie"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn danger" id="ok">Confirmar</button></div>`,
    () => { $('#ok').onclick = async () => { cerrar(); await accion(); }; });
}
/* Registra una lectura en la bitácora solo si es coherente con las que ya hay:
   un horómetro no retrocede. Al registrar un cambio viejo con lectura menor a la
   actual, la lectura queda en el cambio pero no ensucia el cálculo del uso diario. */
function registrarLectura(eq, lectura, fecha){
  eq.bitacora = eq.bitacora || [];
  const otras = eq.bitacora.filter(r => r.fecha !== fecha);
  const antes = otras.filter(r => r.fecha < fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)).pop();
  const despues = otras.filter(r => r.fecha > fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
  const coherente = (!antes || lectura >= antes.lectura) && (!despues || lectura <= despues.lectura);
  if(coherente){
    eq.bitacora = otras.concat([{fecha, lectura}]).sort((a,b) => a.fecha.localeCompare(b.fecha));
    if(eq.bitacora.length > 60) eq.bitacora = eq.bitacora.slice(-60);
  }
  if(lectura >= (eq.lectura||0)){ eq.lectura = lectura; eq.lecturaFecha = fecha; }
  return coherente;
}

          responsable:$('#resp').value.trim(), notas:$('#notas').value.trim()
        });
        if(nuevo){ data.equipos.push(eq); sel = eq.id; vista = 'fichas'; document.body.dataset.mobile = 'ficha'; }
        await persistir(); cerrar(); pintarNav(); pintarLista(); pintarMain(); avisar('Equipo guardado');
      };
      const d = $('#del');
      if(d) d.onclick = () => confirmar('Eliminar equipo', 'Se borra el equipo '+eq.codigo+', su foto y su historial. La hoja de configuración queda intacta.', async () => {
        data.equipos = data.equipos.filter(x => x.id !== eq.id);
        data.historial = data.historial.filter(h => h.equipoId !== eq.id);
        delete fotos[eq.id]; sel = data.equipos[0] ? data.equipos[0].id : null;
        if(eq.fotoUrl && backendConf()) remotoBorrarFoto(eq.id).catch(() => {});
        await persistir(); await DB.guardarFotos(fotos);
        pintarLista(); pintarMain(); avisar('Equipo eliminado');
      });
    });
}
function modalCambio(eq){
  const items = itemsDe(eq);
  abrir(`<h3>Registrar cambio — ${esc(eq.codigo)}</h3>
    <div class="body">
      <div class="fila">
        <label class="f">Fecha<input type="date" id="f" value="${hoy()}"></label>
        <label class="f">${eq.medidor==='km'?'Kilometraje':'Horómetro'} del cambio (${u(eq)})<input type="number" id="l" value="${eq.lectura||''}" inputmode="numeric"></label>
      </div>
      <label class="f">Qué se cambió</label>
      <div id="items">${items.map(it => {
        const p = proyeccion(eq,it);
        const provs = it.proveedores || [];
        const selector = provs.length>1 ? `<select class="prov-usado" data-for="${it.id}" style="display:block;margin-top:4px;font-size:12px;padding:3px 6px;width:100%">
            ${provs.map(pv => `<option value="${pv.id}" ${pv.id===it.proveedorPreferidoId?'selected':''}>${esc(pv.proveedor||'(sin nombre)')} — ${esc(pv.referencia)}</option>`).join('')}
          </select>` : '';
        return `<label class="check"><input type="checkbox" value="${it.id}">
          <span style="flex:1"><span class="c-nom">${esc(it.componente)}</span><br>
          <span class="c-sub">${tieneRef(it)?esc(refTexto(it)):'sin referencia'}${it.cantidad?' · '+esc(it.cantidad)+' '+esc(it.unidad):''} · ${p.txt}</span>
          ${selector}</span></label>`;
      }).join('')}</div>
      <div class="fila" style="margin-top:14px">
        <label class="f">Responsable<input id="r" value="Tulio"></label>
        <label class="f">Costo total<input type="number" id="c" placeholder="0"></label>
      </div>
      <label class="f">Observaciones<textarea id="o" rows="2" placeholder="Se encontró fuga en el retén"></textarea></label>
    </div>
    <div class="pie"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="ok">Guardar cambio</button></div>`,
    () => {
      $('#items').querySelectorAll('.check').forEach(l => {
        const cb = l.querySelector('input');
        cb.onchange = () => l.classList.toggle('on', cb.checked);
      });
      $('#ok').onclick = async () => {
        const ids = [...$('#items').querySelectorAll('input:checked')].map(i => i.value);
        if(!ids.length) return toast('Marque al menos un filtro o aceite.');
        const lectura = Number($('#l').value)||0, fecha = $('#f').value||hoy();
        const regs = ids.map(id => {
          const it = items.find(x => x.id === id);
          fijarUltimo(eq, id, lectura, fecha);
          const sel = $('#items').querySelector('select.prov-usado[data-for="'+id+'"]');
          const provId = sel ? sel.value : it.proveedorPreferidoId;
          const prov = (it.proveedores||[]).find(pv => pv.id === provId) || null;
          return {itemId:id, componente:it.componente, proveedor: prov ? prov.proveedor : '',
            referencia: prov ? prov.referencia : '', cantidad:it.cantidad, unidad:it.unidad};
        });
        const coherente = registrarLectura(eq, lectura, fecha);
        data.historial.push({id:nid(), equipoId:eq.id, fecha, lectura, items:regs,
          responsable:$('#r').value.trim(), costo:$('#c').value===''?null:Number($('#c').value), obs:$('#o').value.trim(),
          registrado:new Date().toISOString()});
        await persistir(); cerrar(); pintarLista(); pintarMain();
        avisar(coherente ? 'Cambio registrado' : 'Cambio registrado. La lectura no cuadra con la bitácora y no se usó para el cálculo del uso diario.');
      };
    });
}

/* ---------------- Arranque y migración ---------------- */
function pintarMain(){
  const f = {tablero:pintarTablero, fichas:pintarFicha, planes:pintarPlanes, requisicion:pintarRequisicion,
             referencias:pintarReferencias, costos:pintarCostos, hist:pintarHistorial, datos:pintarDatos}[vista];
  (f || pintarTablero)();
}
/* Convierte una referencia suelta (versión anterior, un texto por ítem) en
   la lista de proveedores nueva, sin perder lo que ya había digitado. */
function migrarRefItem(it){
  if(!it.proveedores){
    it.proveedores = it.referencia ? [{id:nid(), proveedor:'', referencia:it.referencia, costoUnitario:null}] : [];
    it.proveedorPreferidoId = it.proveedores[0] ? it.proveedores[0].id : null;
  }
  delete it.referencia;
}
function normalizar(){
  data.config = data.config || {urlBase:'', horizonte:30};
  data.historial = data.historial || [];
  data.planes = data.planes || [];
  data.planes.forEach(p => p.items.forEach(migrarRefItem));
  data.equipos.forEach(e => {
    e.bitacora = e.bitacora || [];
    e.estado = e.estado || {};
    e.propios = e.propios || [];
    e.propios.forEach(migrarRefItem);
    if(e.usoDia == null) e.usoDia = USO_DEF[e.tipo] || 6;
    if(!ESTADOS[e.operativo]) e.operativo = 'operativo';
    if(e.lectura && e.lecturaFecha && !e.bitacora.length) e.bitacora.push({fecha:e.lecturaFecha, lectura:e.lectura});
  });
}
/* Convierte datos de la versión anterior (items por equipo) a hojas por modelo */
function migrarAPlanes(){
  data.planes = [];
  const porModelo = new Map();
  data.equipos.forEach(eq => {
    const k = ((eq.marca||'')+' '+(eq.modelo||'')).trim() || eq.codigo;
    if(!porModelo.has(k)) porModelo.set(k, []);
    porModelo.get(k).push(eq);
  });
  porModelo.forEach((eqs, nombre) => {
    const base = eqs.find(e => e.items && e.items.length) || eqs[0];
    /* Al plan solo pasa lo que tienen TODOS los equipos del modelo. Lo que tenía
       uno solo queda como elemento propio suyo, para no agregárselo a los demás. */
    const comunes = (base.items||[]).filter(it =>
      eqs.every(e => (e.items||[]).some(x => x.componente === it.componente)));
    const plan = {id:nid(), nombre, tipo:base.tipo, medidor:base.medidor||'horas',
      items:comunes.map(it => ({id:nid(), categoria:it.categoria, componente:it.componente,
        referencia:it.referencia, cantidad:it.cantidad, unidad:it.unidad, intervalo:it.intervalo}))};
    data.planes.push(plan);
    eqs.forEach(eq => {
      eq.planId = plan.id; eq.estado = eq.estado || {}; eq.propios = eq.propios || [];
      plan.items.forEach(pi => {
        const orig = (eq.items||[]).find(x => x.componente === pi.componente);
        if(orig && orig.ultLectura != null) eq.estado[pi.id] = {ultLectura:orig.ultLectura, ultFecha:orig.ultFecha||''};
      });
      (eq.items||[]).forEach(it => {
        if(plan.items.some(pi => pi.componente === it.componente)) return;
        const copia = {id:nid(), categoria:it.categoria, componente:it.componente, referencia:it.referencia,
                       cantidad:it.cantidad, unidad:it.unidad, intervalo:it.intervalo};
        eq.propios.push(copia);
        if(it.ultLectura != null) eq.estado[copia.id] = {ultLectura:it.ultLectura, ultFecha:it.ultFecha||''};
      });
      delete eq.items;
    });
  });
}
$('#buscar').oninput = e => { filtro = e.target.value; pintarLista(); };
$('#btn-nuevo-equipo').onclick = () => modalEquipo(null);

(async function init(){
  const res = await Promise.all([DB.cargar(), DB.cargarFotos()]);
  let guardado = res[0];
  fotos = res[1] || {};
  if(guardado && guardado.equipos){
    data = guardado;
    if(!data.planes || !data.planes.length){ migrarAPlanes(); await DB.guardar(data); }
  } else {
    const viejo = await DB.cargarViejo();
    if(viejo && viejo.equipos){
      data = {planes:[], equipos:viejo.equipos, historial:viejo.historial||[], config:viejo.config||{urlBase:'',horizonte:30}};
      migrarAPlanes();
      toast('Se convirtieron sus fichas al nuevo formato por hojas de configuración');
    } else {
      data = semilla();
    }
    await DB.guardar(data);
  }
  normalizar();
  sel = data.equipos[0] ? data.equipos[0].id : null;

  const h = decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();
  if(h){
    const eq = data.equipos.find(e => e.codigo.toLowerCase() === h.toLowerCase());
    if(eq){ sel = eq.id; vista = 'fichas'; }
  }
  if(window.innerWidth > 860 || vista !== 'fichas') document.body.dataset.mobile = 'ficha';
  pintarNav(); pintarLista(); pintarMain();
  comprobarAlmacenamiento();
  asegurarFotos();
})();

if('serviceWorker' in navigator){
  /* Cuando entra en control una versión nueva del service worker (por una
     publicación reciente), recarga sola una vez para que la pestaña ya
     abierta muestre el cambio, en vez de quedar pegada a la versión vieja
     hasta que alguien haga un refresco forzado. */
  let recargoPorSW = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(recargoPorSW) return;
    recargoPorSW = true;
    location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* Comprueba guardando de verdad, no adivinando. Reintenta una vez por si el
   almacenamiento todavía no estaba listo al abrir la página. */
async function comprobarAlmacenamiento(){
  if(await DB.guardar(data)) return;
  setTimeout(async () => {
    const ok = await DB.guardar(data);
    if(!ok){ sinAlmacenamiento = true; pintarAvisoAlmacenamiento(); }
  }, 1500);
}
</script>
